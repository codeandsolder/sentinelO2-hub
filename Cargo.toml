[workspace]
resolver = "3"
members = [
  "crates/sentinel0-hub-core",
  "crates/sentinel0-hub-native",
  "crates/sentinel0-hub-worker",
]
default-members = [
  "crates/sentinel0-hub-core",
  "crates/sentinel0-hub-native",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/codeandsolder/sentinelO2-hub"
rust-version = "1.100"

[workspace.dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "ws", "tracing", "tower-log"] }
clap = { version = "4.6.7", features = ["derive"] }
time = { version = "0.3.55", features = ["wasm-bindgen"] }
futures-util = "0.3.34"
http = "1.5.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "signal"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.23.0", features = ["serde", "v7"] }
sentinel0-proto = { git = "https://github.com/codeandsolder/sentinelO2-cloud-core.git", rev = "e60e0abebe92aaafb88952a2eece08867feb165a", package = "sentinel0-proto" }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
unexpected_cfgs = "warn"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
too_many_lines = "warn"
must_use_candidate = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
similar_names = "warn"

[patch.crates-io]
worker = { git = "https://github.com/codeandsolder/cargo-patches.git", rev = "013043a6823c66a0f4e4c72059750d1543a7d4e3" }

axum = { git = "https://github.com/codeandsolder/cargo-patches.git", rev = "431662f5e38c95ac118f9895a0e8f48f3245de8e" }
