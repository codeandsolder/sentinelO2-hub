name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# New commits to a PR supersede stale checks, but not main pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Resolve the native quarantined compiler
        id: compiler
        uses: codeandsolder/ci-workflows/.github/actions/resolve-rust-toolchain@1ef8b180d04fbeb8c095e8d701f8a5107472370e # main
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ steps.compiler.outputs.channel }}
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown
      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@1ef8b180d04fbeb8c095e8d701f8a5107472370e # main
        with:
          rust-toolchain: ${{ steps.compiler.outputs.channel }}
      - name: Format
        run: cargo fmt --all --check
      - name: Check
        run: cargo check --locked --workspace
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Worker WASM Clippy
        run: cargo clippy --locked -p sentinel0-hub-worker --target wasm32-unknown-unknown --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace

      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@1ef8b180d04fbeb8c095e8d701f8a5107472370e # main
